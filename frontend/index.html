    <title>Cred</title>
    <script>
      // Apply the saved/system theme before first paint (no flash).
      try {
        var t = localStorage.getItem("le_theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
